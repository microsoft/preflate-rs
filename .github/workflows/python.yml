name: Python tooling

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        python-version: "3.14"
    - name: Sync locked dependencies
      run: uv sync --locked --extra jpeg --extra parquet
    - name: Build native SQLite scanner
      run: cargo build --release --locked -p preflate_util --bin preflate_scan
    - name: Test corpus database
      run: uv run --locked --extra jpeg --extra parquet python -W error -m unittest corpus.database.test_database corpus.crawl.test_rare_crawl corpus.crawl.test_parquet_index -v
    - name: Check Python entry points
      run: |
        uv run --locked --extra jpeg --extra parquet python -W error -m corpus.database --help
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        uv run --locked --extra jpeg --extra parquet python -W error -m corpus.crawl --help
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        uv run --locked --extra jpeg --extra parquet python -W error corpus\gen_corpus.py --help
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        uv run --locked --extra jpeg --extra parquet python -W error corpus\gen_fuzz.py --help
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        uv run --locked --extra jpeg --extra parquet python -W error corpus\profile_container.py --help
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        uv run --locked --extra jpeg --extra parquet python -W error -c "from PIL import Image"
