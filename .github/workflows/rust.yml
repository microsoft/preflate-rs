name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
      with:
        toolchain: stable
        targets: wasm32-wasip1,aarch64-unknown-linux-musl,x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu
        components: rustfmt,clippy

    - name: Check formatting
      run: cargo fmt --check --all
    - name: Build debug
      run: cargo build --verbose --locked --all
    - name: Run tests
      run: cargo test --verbose --all
    - name: Test CABAC SIMD feature
      run: cargo test --locked --package cabac --all-features
    - name: Check CABAC benchmarks
      run: cargo check --locked --package cabac --benches --all-features
    - name: Build release
      run: cargo build --verbose --locked --release --all
