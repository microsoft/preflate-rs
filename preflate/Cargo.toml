[package]
name = "preflate-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = """
Extracts plaintext and compact reconstruction data from existing DEFLATE streams
for recompression with modern algorithms, while recreating the exact original
compressed bytes through compressor modelling and prediction corrections.
"""
readme = "../README.md"
categories = ["compression"]
keywords = ["gzip", "deflate", "zlib", "zip", "png"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byteorder = "1.4"
default-boxed = "0.2"
bitcode = "0.6.3"
deranged = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
env_logger = "0.11"
crc32fast = "1.3"

[lib]
name = "preflate_rs"
crate-type = ["lib"]

[features]
diagnostics = []
