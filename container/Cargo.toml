[package]
name = "preflate-container"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = """
Scans binary files for DEFLATE streams and uses preflate-rs to extract plaintext and
reconstruction data for Zstd compression. PNG images can use lossless WebP storage.
"""
categories = ["compression"]
keywords = ["gzip", "deflate", "zlib", "zip"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byteorder = "1.4"
preflate-rs = { path = "../preflate" }
log = "0.4"
webp = { version = "0.3", optional = true }
crc32fast = "1.3"
zstd = "0.13.0"
lepton_jpeg = "0.5.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
env_logger = "0.11"
miniz_oxide = "0.9"
adler32 = "1.2.0"

[lib]
name = "preflate_container"
crate-type = ["lib"]

[features]
diagnostics = ["preflate-rs/diagnostics"]
webp = ["dep:webp"]
default = ["webp"]