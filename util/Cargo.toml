[package]
name = "preflate_util"
default-run = "preflate_util"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
preflate-rs = { path = "../preflate" }
preflate-container = { path = "../container", features = ["diagnostics"] }
env_logger = "0.11"
log = "0.4"
clap ={ version = "4", features = ["derive"]}
cpu-time = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
crc32fast = "1.3"
miniz_oxide = "0.9"
tempfile = "3"

[[bin]]
name = "preflate_util"

[[bin]]
name = "preflate_scan"
path = "src/scan_main.rs"

[[bin]]
name = "preflate_match_check"
path = "src/match_main.rs"

[[bin]]
name = "preflate_replay"
path = "src/replay_main.rs"
